<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Registro de Usuario</ion-title>
    <ion-button slot="end" fill="clear" (click)="toggleDarkMode()">
      <ion-icon slot="icon-only" [name]="isDarkMode() ? 'sunny-outline' : 'moon-outline'"></ion-icon>
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
    <ion-list lines="full">

      <ion-item>
        <ion-input
          label="Nombre completo"
          labelPlacement="floating"
          type="text"
          formControlName="nombre"
          [errorText]="'El nombre es obligatorio (mín. 3 caracteres).'">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Correo Electrónico"
          labelPlacement="floating"
          type="email"
          inputmode="email"
          formControlName="email"
          [errorText]="'Introduzca un email válido.'">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Contraseña"
          labelPlacement="floating"
          type="password"
          formControlName="password"
          [errorText]="'Mínimo 8 caracteres, letras y números.'">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Fecha de nacimiento"
          labelPlacement="floating"
          type="date"
          formControlName="fechaNacimiento"
          [errorText]="f['fechaNacimiento'].errors?.['fechaFutura'] ? 'La fecha no puede ser posterior a hoy.' : 'La fecha de nacimiento es obligatoria.'">
        </ion-input>
      </ion-item>

    </ion-list>

    <div class="ion-padding-top">
      <ion-button expand="block" type="submit" [disabled]="registroForm.invalid || isSubmitting()">
        <span *ngIf="!isSubmitting()">Registrarse</span>
        <ion-spinner name="crescent" *ngIf="isSubmitting()"></ion-spinner>
      </ion-button>

      <ion-button expand="block" fill="outline" *ngIf="lastSubmission()" (click)="descargarPdf()">
        <ion-icon slot="start" name="download-outline"></ion-icon>
        Descargar datos en PDF
      </ion-button>

      <ion-button expand="block" fill="clear" routerLink="/driven">
        Ver formulario Template-Driven
      </ion-button>
    </div>
  </form>

  <ion-toast
    [isOpen]="showToast()"
    message="Formulario enviado correctamente"
    duration="2500"
    color="success"
    position="top"
    (didDismiss)="showToast.set(false)">
  </ion-toast>
</ion-content>
